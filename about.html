<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Lilibonome</title>
    <meta name="description" content="About Lilibonome.">

    <style>
        :root {
            --nc-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            --nc-tx-1: #fff;
            --nc-tx-2: #eee;
            --nc-bg-3: #222;
            --nc-lk-1: #3291FF;
            --accent-green: rgba(66, 133, 244, .8)
        }

        * {
            margin: 0;
            padding: 0
        }

        html {
            font-family: var(--nc-font-sans)
        }

        body {
            margin: 0 auto;
            max-width: 750px;
            padding: 2rem 1rem;
            overflow-x: hidden;
            word-break: break-word;
            overflow-wrap: break-word;
            background: linear-gradient(45deg, #050505, #0a0a0a, #050505);
            color: var(--nc-tx-2);
            font-size: 1.05rem;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--nc-lk-1);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .main-container {
            flex: 1;
            animation: pageLoad 0.8s ease-out;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            color: var(--nc-tx-1);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        p {
            margin-bottom: 1.2rem;
            opacity: 0.9;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @keyframes pageLoad {
            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .copyright-container {
            display: flex;
            justify-content: center;
            margin-top: 5vh;
            padding-bottom: 2vh;
            font-size: 12px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Source Code Pro', Menlo, Consolas, 'Courier New', monospace;
            opacity: 0.7
        }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
