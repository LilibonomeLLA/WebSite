<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Convertisseur Markdown vers Tableau des Favoris</title>
  <!-- Lien vers votre feuille de style pour l'aperçu -->
  <link rel="stylesheet" href="CSS/tableau_css.css">
  <style>
    /* Style minimaliste uniquement pour la zone du formulaire de conversion */
    .zone-outil {
      background: #f4f4f4;
      color: #333;
      padding: 20px;
      margin: 20px auto;
      max-width: 800px;
      border-radius: 5px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div class="zone-outil">
    <form id="formulaire-conversion">
      <label for="fichier-md"><strong>Sélectionnez un fichier Markdown (.md) :</strong></label><br><br>
      <input type="file" id="fichier-md" accept=".md,.markdown,.txt" required>
      <button type="button" id="btn-convertir">Convertir et télécharger en HTML</button>
    </form>

    <!-- Compteur de lignes traitées dans l'outil -->
    <p id="compteur-lignes" style="font-weight: bold; margin-top: 15px;"></p>
  </div>

  <!-- Zone d'aperçu avec votre charte graphique -->
  <div id="apercu"></div>

  <script>
    document.getElementById("btn-convertir").addEventListener("click", function() {
      const input = document.getElementById("fichier-md");
      const fichier = input.files[0];

      if (!fichier) {
        alert("Veuillez sélectionner un fichier Markdown.");
        return;
      }

      const lecteur = new FileReader();

      lecteur.onload = function(evenement) {
        const contenuMarkdown = evenement.target.result;
        const resultat = convertirTableauMarkdownEnHtml(contenuMarkdown);

        // 1. Affichage du compteur dans la zone formulaire
        const zoneCompteur = document.getElementById("compteur-lignes");
        if (resultat.nombreLignes > 0) {
          zoneCompteur.textContent = `Nombre de lignes traitées et triées : ${resultat.nombreLignes}`;
        } else {
          zoneCompteur.textContent = "Aucune ligne de données traitée.";
        }

        // 2. Affichage de l'aperçu sur la page
        document.getElementById("apercu").innerHTML = resultat.corpsHtml;

        // 3. Génération du fichier HTML complet selon votre modèle exact
        if (resultat.nombreLignes > 0) {
          const pageHtmlComplete = `<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Tableau des Favoris</title>
  <meta name="viewport" content="initial-scale=1.0; maximum-scale=1.0; width=device-width;">
  <link rel="stylesheet" href="CSS/tableau_css.css">
</head>

<body>
${resultat.corpsHtml}
</body>

</html>`;

          telechargerFichier(pageHtmlComplete, "favoris-convertis.html");
        }
      };

      lecteur.readAsText(fichier);
    });

    function formaterCellule(texte) {
      // Transforme un lien Markdown [titre](url) en balise <a>
      const regexLienMd = /^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/;
      const matchMd = texte.match(regexLienMd);
      if (matchMd) {
        return `<a href="${matchMd[2]}" target="_blank">${matchMd[1]}</a>`;
      }

      // Transforme une URL brute http:// ou https:// en balise <a>
      if (/^https?:\/\/\S+$/.test(texte)) {
        return `<a href="${texte}" target="_blank">${texte}</a>`;
      }

      return texte;
    }

    function convertirTableauMarkdownEnHtml(markdown) {
      const lignes = markdown.split("\n")
        .map(ligne => ligne.trim())
        .filter(ligne => ligne.startsWith("|") && ligne.endsWith("|"));

      if (lignes.length < 2) {
        return {
          corpsHtml: "<p style='text-align:center;'>Aucun tableau Markdown valide trouvé.</p>",
          nombreLignes: 0
        };
      }

      // 1. Extraction des en-têtes (première ligne)
      const entetes = lignes[0].split("|").slice(1, -1).map(c => c.trim());

      // 2. Extraction des lignes de données (en ignorant la ligne de séparation |---|---|)
      const lignesDonnees = lignes.slice(1)
        .filter((ligne, index) => !(index === 0 && ligne.includes("-")))
        .map(ligne => ligne.split("|").slice(1, -1).map(c => c.trim()));

      // 3. Tri alphabétique sur la 1ère colonne (index 0 : Catégorie)
      lignesDonnees.sort((ligneA, ligneB) => {
        const categorieA = ligneA[0] || "";
        const categorieB = ligneB[0] || "";
        return categorieA.localeCompare(categorieB, "fr", { sensitivity: "base" });
      });

      const compteur = lignesDonnees.length;

      // 4. Construction du tableau HTML
      let tableauHtml = `  <table class="table-fill">\n    <thead>\n      <tr>\n`;
      entetes.forEach(entete => {
        tableauHtml += `        <th class="text-left"><strong>${entete}</strong></th>\n`;
      });
      tableauHtml += `      </tr>\n    </thead>\n    <tbody class="table-hover">\n`;

      lignesDonnees.forEach(cellules => {
        tableauHtml += `      <tr>\n`;
        cellules.forEach(cellule => {
          const contenuFormate = formaterCellule(cellule);
          tableauHtml += `        <td class="text-left">${contenuFormate}</td>\n`;
        });
        tableauHtml += `      </tr>\n`;
      });

      tableauHtml += `    </tbody>\n  </table>`;

      // 5. Assemblage final avec bannière et titre dynamique
      const htmlComplet = `<!-- Tableau => en construction -->
<div>
  <table style="all: unset; display: revert;width: 100%; border-collapse: collapse; border: none;">
    <!--  border: 1px solid white; -->
    <tr style="all: unset; display: revert;">
      <td style="all: unset; display: revert;vertical-align: middle; text-align: left; ">...</td>
      <td style="all: unset; display: revert;width: 80%;vertical-align: middle; text-align: center; "><img src="assets/under-construction-sutton-group-heritage-realty-brokerage-durham-region-real-estate-16.png" alt="En construction" style="width: 250px; height: auto;"></td>
      <td style="all: unset; display: revert;vertical-align: middle; text-align: left; ">...</td>
    </tr>
  </table>
</div>

  <div class="table-title">
    <h3>Liste de Favoris (${compteur})</h3>
  </div>
${tableauHtml}`;

      return {
        corpsHtml: htmlComplet,
        nombreLignes: compteur
      };
    }

    function telechargerFichier(contenu, nomFichier) {
      const blob = new Blob([contenu], { type: "text/html;charset=utf-8" });
      const lien = document.createElement("a");
      lien.href = URL.createObjectURL(blob);
      lien.download = nomFichier;
      lien.click();
      URL.revokeObjectURL(lien.href);
    }
  </script>

</body>
</html>
